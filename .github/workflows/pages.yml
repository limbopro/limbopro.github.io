name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]      # 你就是 master，已经写好
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键：上传时把大文件全部排除（jpg 特别大，最常见元凶）
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .                       # 直接上传仓库根目录（因为你就是纯静态）
          exclude: |
            **/*.jpg
            **/*.jpeg
            **/*.png
            **/*.gif
            **/*.webp
            **/*.mp4
            **/*.mov
            **/*.zip
            **/*.rar
            **/*.pdf
            **/videos/**
            **/downloads/**
            **/big-images/**
            **/assets/huge/**
            .git/**
            .github/**

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
